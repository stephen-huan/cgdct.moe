<table>
  <thead>
    <tr class="header">
      <th>Date</th>
      <th>Post</th>
    </tr>
  </thead>
  <tbody>
    $for(it.posts)$
    <tr>
      <th scope="row"><time datetime="$it.date$">$it.date$</time></th>
      <td><a href="$it.url$">$it.title$</a></td>
    </tr>
    $endfor$
  </tbody>
</table>
