$if(it.subtitle)$
<p class="subtitle">$it.subtitle$</p>
$endif$ $if(show-author)$ $for(author)$
<p class="author">$author$</p>
$endfor$ $endif$
<span class="post-meta"
  ><time class="date" datetime="$it.date$">$it.date$</time></span
>$if(it.keywords)$<span class="post-tags"
  >&nbsp; &middot; $for(it.keywords)$ &nbsp;<a href="/tag/$it$"
    ><b>#</b> $it$</a
  >
  $endfor$
</span>
$endif$
